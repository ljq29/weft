name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  test-build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = uv run python -c "import weft; print(weft.__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - run: uv run poe check
      - run: uv run poe integration
      - run: pnpm -C frontend build
      - run: pnpm -C e2e exec playwright install chromium
      - run: pnpm -C e2e test
      - run: uv build --wheel --out-dir dist packages/weft-sdk
      - run: uv build --wheel --out-dir dist packages/weft-worker
      - run: uv build --wheel --out-dir dist packages/weft
      - run: uv run python scripts/build_portable.py --skip-frontend-build --skip-wheel-build
      - name: Verify clean bootstrap and cached offline execution
        run: uv run python scripts/verify_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: weft-${{ github.ref_name }}-packages
          path: |
            dist/*.whl
            dist/*.zip
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist | Where-Object { $_.Extension -in '.whl', '.zip' } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --title "Weft $env:GITHUB_REF_NAME" --generate-notes
