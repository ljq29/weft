name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  lint-and-type:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run poe lint
      - run: pnpm -C frontend lint
      - run: pnpm -C frontend typecheck

  unit-and-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run poe test
      - run: uv run poe integration
      - run: uv run poe coverage

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend build
      - run: pnpm -C e2e exec playwright install chromium
      - run: pnpm -C e2e test

  build-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend build
      - run: uv build --wheel --out-dir dist packages/weft-sdk
      - run: uv build --wheel --out-dir dist packages/weft-worker
      - run: uv build --wheel --out-dir dist packages/weft
      - run: uv run python scripts/build_portable.py --skip-frontend-build --skip-wheel-build
      - name: Verify clean bootstrap and cached offline execution
        run: uv run python scripts/verify_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: weft-packages
          path: |
            dist/*.whl
            dist/*.zip
