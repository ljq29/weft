[project]
name = "weft-worker"
version = "0.3.0"
description = "Isolated workflow worker for Weft"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["weft-sdk==0.3.0", "polars>=1.0", "pyarrow>=15", "send2trash>=1.8"]

[project.scripts]
weft-worker = "weft_worker.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weft_worker"]

[tool.uv.sources]
weft-sdk = { workspace = true }
