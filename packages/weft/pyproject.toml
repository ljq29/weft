[project]
name = "weft"
version = "0.4.0"
description = "Local-first visual workflow tool"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "weft-sdk==0.4.0",
  "weft-worker==0.4.0",
  "pydantic>=2.10",
  "jsonschema>=4.23",
  "polars>=1.0",
  "pyarrow>=15",
  "simpleeval>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "jinja2>=3.1",
  "apscheduler>=3.11",
  "watchdog>=6.0",
  "xlwings>=0.30; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
  "loguru>=0.7",
]

[project.scripts]
weft = "weft.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.uv.sources]
weft-sdk = { workspace = true }
weft-worker = { workspace = true }
